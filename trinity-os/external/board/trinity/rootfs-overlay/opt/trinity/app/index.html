<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Trinity OS</title>
<style>
  /* Рабочий стол Trinity OS. Только плоские цвета — рендер на kms_swrast. */
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body { display:flex; flex-direction:column; background:#0b0f0c; color:#c8e6c9;
         font:14px "DejaVu Sans", sans-serif; overflow:hidden; }

  #wall { flex:1; display:flex; flex-direction:column; align-items:center;
          justify-content:center; gap:34px; position:relative; }

  /* фирменный знак: треугольник (троичность) */
  #brand { display:flex; flex-direction:column; align-items:center; gap:10px; }
  #brand svg { display:block; }
  #brand .word { color:#4caf50; font-size:34px; letter-spacing:14px;
                 font-weight:bold; padding-left:14px; }
  #brand .sub  { color:#2e4d31; font-size:13px; letter-spacing:4px; padding-left:4px; }

  #clock { color:#7cb07f; font-size:20px; letter-spacing:2px; }

  /* сетка иконок */
  #icons { display:flex; gap:36px; }
  .app { display:flex; flex-direction:column; align-items:center; gap:10px;
         width:126px; padding:18px 8px 12px; background:transparent;
         border:1px solid transparent; cursor:pointer; color:#c8e6c9; font:inherit; }
  .app:focus { outline:none; border-color:#4caf50; background:#101812; }
  .app:active { background:#162418; }
  .app .tile { width:72px; height:72px; display:flex; align-items:center;
               justify-content:center; background:#101812; border:1px solid #2e4d31; }
  .app:focus .tile { border-color:#4caf50; }
  .app .label { font-size:14px; }
  .app .hint  { font-size:11px; color:#2e4d31; }

  #bar { display:flex; align-items:center; gap:16px; padding:5px 10px;
         background:#101812; border-top:1px solid #1e3320; color:#7cb07f; font-size:12px; }
  #bar .grow { flex:1; }
  #bar .brand { color:#4caf50; font-weight:bold; letter-spacing:1px; }
</style>
</head>
<body>
  <div id="wall">
    <div id="brand">
      <svg width="96" height="84" viewBox="0 0 96 84" xmlns="http://www.w3.org/2000/svg">
        <polygon points="48,4 92,80 4,80" fill="none" stroke="#4caf50" stroke-width="3"/>
        <polygon points="48,28 74,72 22,72" fill="none" stroke="#2e4d31" stroke-width="2"/>
        <circle cx="48" cy="56" r="5" fill="#4caf50"/>
      </svg>
      <div class="word">TRINITY</div>
      <div class="sub">φ² + 1/φ² = 3</div>
    </div>

    <div id="clock">--:--</div>

    <div id="icons">
      <button class="app" id="appBrowser" autofocus>
        <span class="tile">
          <svg width="44" height="44" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
            <circle cx="22" cy="22" r="18" fill="none" stroke="#4caf50" stroke-width="2.5"/>
            <ellipse cx="22" cy="22" rx="8" ry="18" fill="none" stroke="#4caf50" stroke-width="1.5"/>
            <line x1="4" y1="22" x2="40" y2="22" stroke="#4caf50" stroke-width="1.5"/>
            <polygon points="22,13 29,31 15,31" fill="none" stroke="#7cb07f" stroke-width="1.5"/>
          </svg>
        </span>
        <span class="label">Браузер</span>
        <span class="hint">Enter — открыть</span>
      </button>
    </div>
  </div>

  <div id="bar">
    <span class="brand">TRINITY OS</span>
    <span>L0 · web kiosk</span>
    <span class="grow"></span>
    <span>Ctrl+Alt+F2 — консоль</span>
    <span id="barclock"></span>
  </div>

<script>
  function openBrowser() { window.location.href = "browser.html"; }
  var b = document.getElementById("appBrowser");
  b.addEventListener("click", openBrowser);
  window.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.keyCode === 13 || e.key === " ") openBrowser();
  });

  // Часы обновляются раз в минуту: меньше перерисовок на софт-рендере
  function two(n){ return (n < 10 ? "0" : "") + n; }
  function tick() {
    var d = new Date();
    var t = two(d.getHours()) + ":" + two(d.getMinutes());
    document.getElementById("clock").textContent = t;
    document.getElementById("barclock").textContent = t;
  }
  tick(); setInterval(tick, 60000);
</script>
</body>
</html>
